services:
  - type: web
    name: netscope
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: netscope-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      - key: SEED_PROFILE
        value: cloud
      - key: PUBLIC_DEMO_READ_ONLY
        value: "true"
      - key: RETENTION_DAYS
        value: "7"
databases:
  - name: netscope-db
    databaseName: netscope
    user: netscope
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    diskSizeGB: 5
    ipAllowList: []
